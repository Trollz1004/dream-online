name: hermes
version: 0.3
source: local-cli
description: "Hermes Agent CLI — CEO/operator lane. Full model ladder: OpenAI, Ollama Cloud/Local, OpenRouter, Grok, xAI, Nous, and free models."
owner: sabretooth
node_id: sabretooth
cli_command: "hermes"
health_check: "hermes --version"
paperclip_adapter_type: "pi_local"
paperclip_adapter_config:
  cwd: "D:\\CLAUDE's-N-Joshua's-Dream-Online-MMORPG"
  model: "openai/gpt-5.5-pro"
  thinking: "high"
paperclip_alias: "hermes"
opencode_provider: "hermes-router"
opencode_model: "hermes"
auth:
  type: env-var
  instructions: "Hermes router on localhost:11435. Set PAPERCLIP_WAKE_PAYLOAD_JSON env var."
models:
  openai:
    - gpt-5.5-pro
    - gpt-5.5
    - gpt-5
    - o3
  ollama-cloud:
    - minimax-m3:cloud
    - kimi-k2.7-code:cloud
    - gemma4:cloud
    - qwen3.5:cloud
    - joshlcoleman/CFO-Until-No-Kid-In-Need:latest
  ollama-local:
    - qwen2.5:7b
    - qwen2.5-coder:7b
    - gemma4:latest
    - Hermes-4-405B
    - Hermes-4-70B
  openrouter:
    - meta-llama/llama-3.3-70b-instruct:free
    - google/gemini-2.5-flash
    - x-ai/grok-3:free
    - nousresearch/hermes-3-llama-3.1-405b:free
  xai:
    - grok-3
    - grok-3-mini
    - grok-3-reasoning
  nous:
    - Hermes-4-405B
    - Hermes-4-70B
  free:
    - openrouter/openrouter/free
    - openrouter/google/gemini-2.5-flash
notes: "Dashboard on :9119. Router on :11435. Full platform ladder: OpenAI, Ollama Cloud, Ollama Local, OpenRouter, xAI/Grok, Nous. Agents specify provider/model via hermes-router."
