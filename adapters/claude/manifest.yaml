name: claude
version: 0.3
source: local-cli
description: "Claude Code — Paperclip `claude_local` adapter running the real signed-in CLI. No proxy, no interception, no API key held in this repo."
owner: sabretooth
node_id: sabretooth
cli_command: "claude"
health_check: "claude --version && echo claude:healthy || echo claude:unavailable"

# --- PAPERCLIP OS ADAPTER TYPE ---
# Paperclip runs Claude Code natively via `claude_local`. It talks to the real
# CLI using Joshua's own signed-in session. Nothing rewrites ANTHROPIC_BASE_URL
# and nothing sits in front of it.
paperclip_adapter_type: "claude_local"
paperclip_adapter_config:
  cwd: "D:\\CLAUDE's-N-Joshua's-Dream-Online-MMORPG"
  model: "claude-sonnet-5"
  env:
    CLAUDE_CODE_MAX_OUTPUT_TOKENS: "8192"

paperclip_alias: "claude"
opencode_provider: "openai"
opencode_model: "gpt-5.5"
notes: "Uses the `claude_local` Paperclip adapter type against the real CLI and its default config dir (~/.claude). Do not set ANTHROPIC_BASE_URL or ANTHROPIC_AUTH_TOKEN here — a redirected base URL is how the FCC lane worked, and FCC is permanently banned. Dedicated 'openai' provider for opencode routing. Never share the 'codex' provider."
