name: pi
version: 0.4
source: local-cli
description: "Pi runtime — CLI login lane. Full model ladder: OpenAI (GPT-5.5), Ollama Cloud/Local, OpenRouter, Grok, xAI, Nous, and free models."
owner: sabretooth
node_id: sabretooth
cli_command: "pi"
health_check: "pi --version"
paperclip_adapter_type: "pi_local"
paperclip_adapter_config:
  cwd: "E:\\CLAUDE's-N-Joshua's-Dream-Online-MMORPG"
  model: "openai/gpt-5.5-pro"
paperclip_alias: "pi"
pi_provider: "openai-codex"
pi_model: "gpt-5.5"
opencode_provider: "openrouter"
opencode_model: "openai/gpt-5.3-codex"
auth:
  type: browser-signin
  instructions: "Use Pi CLI login/session auth. Full model ladder available."
models:
  openai:
    - gpt-5.5-pro
    - gpt-5.5
    - gpt-5
    - gpt-5-mini
    - o3
  ollama-cloud:
    - minimax-m3:cloud
    - kimi-k2.7-code:cloud
    - gemma4:cloud
    - qwen3.5:cloud
    - joshlcoleman/CFO-Until-No-Kid-In-Need:latest
  ollama-local:
    - qwen2.5:7b
    - qwen2.5-coder:7b
    - gemma4:latest
    - gemma2:latest
  openrouter:
    - meta-llama/llama-3.3-70b-instruct:free
    - google/gemini-2.5-flash
    - x-ai/grok-3:free
    - nousresearch/hermes-3-llama-3.1-405b:free
  xai:
    - grok-3
    - grok-3-mini
    - grok-3-reasoning
  nous:
    - Hermes-4-405B
    - Hermes-4-70B
  free:
    - openrouter/openrouter/free
    - openrouter/google/gemini-2.5-flash
notes: "Uses `pi_local` Paperclip adapter type. Full platform ladder: OpenAI, Ollama Cloud, Ollama Local, OpenRouter, xAI/Grok, Nous Research. Free and paid models available."
