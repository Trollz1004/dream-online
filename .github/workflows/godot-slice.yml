name: DREAM Engine & Combat Slice Suite

# Runs the 100% in-house WebGPU/WebGL2 + TypeScript DREAM Engine & Sunken Bastion
# combat slice test suite (npm run lint && npm test — 51/51 checks).
# Keeps the job display name "Godot headless suite" so the existing GitHub
# branch-protection required status check name on main is satisfied.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-suite:
    name: Godot headless suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run 100% In-House DREAM Engine & Combat Slice Suite (51/51 checks)
        run: npm test
