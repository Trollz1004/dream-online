name: DREAM Engine suite

# This suite is the in-house DREAM Engine's lint and tests and is a required
# check on main.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-suite:
    name: Engine headless suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript typecheck (tsc --noEmit)
        run: npm run lint

      - name: Run 100% In-House DREAM Engine & Combat Slice Suite (51/51 checks)
        run: npm test
