<style>
  three-d-stage:not(:defined){visibility:hidden}
  body{margin:0;background:#020617}
  .hdr{position:fixed;top:14px;left:14px;z-index:10;background:rgba(15,23,42,0.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 0 20px rgba(0,0,0,0.5);border-radius:14px;padding:10px 16px;font-family:'JetBrains Mono',monospace;color:#e2e8f0}
  .hdr b{color:#22d3ee;font-size:13px;letter-spacing:0.1em}
  .hdr div{font-size:9.5px;color:#64748b;letter-spacing:0.08em;margin-top:3px}
  .hdr a{color:#f472b6;text-decoration:none}
  .hdr a:hover{color:#f9a8d4}
  .bar{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:7px;background:rgba(15,23,42,0.6);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);box-shadow:0 0 20px rgba(0,0,0,0.5);border-radius:16px;padding:9px 11px}
  .bar button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;color:#94a3b8;background:rgba(2,6,23,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:8px 11px;cursor:pointer;transition:all 150ms ease}

  .bar button:active{transform:scale(0.95)}
  .bar button.on{color:#22d3ee;border-color:rgba(34,211,238,0.5);background:rgba(34,211,238,0.12);box-shadow:0 0 12px rgba(34,211,238,0.25)}

<body>
<div class="hdr"><b>SUP@ · ULTRACODE — THE UNFINISHED THOUGHT</b><div>DREAM ONLINE · DRAG = FULL 360° ORBIT · SCROLL = ZOOM · <a href="Sup@ Ultracode.dc.html">← SUP@ DESIGN BOARD</a></div></div>
<three-d-stage name="sup-companion" background="#020617" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const g = new THREE.Group(); g.name = 'sup-at-ultracode';
const mat = (name, color, rough, metal) => { const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal }); m.name = name; return m; };
const M = {
  core: mat('core', 0xa5f3fc, 0.25, 0.1),
  iris: mat('iris', 0x0e7490, 0.2, 0.2),
  pupil: mat('pupil', 0x020617, 0.15, 0.3),
  shell: mat('shell', 0x1e293b, 0.45, 0.35),
  ringCyan: mat('ring-cyan', 0x22d3ee, 0.3, 0.35),
  ringPink: mat('ring-pink', 0xec4899, 0.3, 0.35),
  gold: mat('gold', 0xe9b949, 0.35, 0.4)
};
M.core.transparent = true; M.core.opacity = 0.34; // glass shell — the thought shows through
const mesh = (geo, m, name, x, y, z) => { const ms = new THREE.Mesh(geo, m); ms.name = name; ms.position.set(x, y, z); g.add(ms); return ms; };
const CY = 0.42; // hover height of the core
mesh(new THREE.SphereGeometry(0.16, 48, 32), M.core, 'core', 0, CY, 0);
// the thought-spiral — a golden coil that never closes
class Spiral extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const a = t * 2.6 * Math.PI * 2, r = 0.015 + 0.115 * t;
    return target.set(Math.cos(a) * r, Math.sin(a) * r, -0.015 + 0.03 * t);
  }
}
mesh(new THREE.TubeGeometry(new Spiral(), 220, 0.011, 10), M.gold, 'thought-spiral', 0, CY, 0);
mesh(new THREE.SphereGeometry(0.06, 32, 24), M.iris, 'iris', 0, CY, 0.121);
mesh(new THREE.SphereGeometry(0.03, 24, 16), M.pupil, 'pupil', 0, CY, 0.156);
// the @ eye — an open coil around the pupil
const atCoil = mesh(new THREE.TorusGeometry(0.048, 0.007, 10, 48, 4.8), M.gold, 'at-coil', 0, CY, 0.145);
atCoil.rotation.z = 0.9;
// 5 shell plates, gap at the front so the eye stays clear
for (let i = 0; i < 5; i++) {
  const a = Math.PI * 2 * (i + 1) / 6;
  const p = mesh(new THREE.BoxGeometry(0.10, 0.15, 0.028), M.shell, 'shell-plate-' + (i + 1),
    Math.sin(a) * 0.205, CY + (i % 2 ? 0.012 : -0.012), Math.cos(a) * 0.205);
  p.rotation.y = a;
  p.rotation.z = i % 2 ? 0.12 : -0.12;
}
// halo rings — open arcs; a closed ring is a finished thought
const r1 = mesh(new THREE.TorusGeometry(0.30, 0.012, 20, 120, 5.5), M.ringCyan, 'halo-ring-inner', 0, CY, 0);
r1.rotation.x = 1.25; r1.rotation.z = 0.4;
const r2 = mesh(new THREE.TorusGeometry(0.34, 0.012, 20, 120, 5.3), M.ringCyan, 'halo-ring-mid', 0, CY, 0);
r2.rotation.x = -1.25; r2.rotation.y = 0.5;
const r3 = mesh(new THREE.TorusGeometry(0.38, 0.010, 20, 120, 5.7), M.ringPink, 'halo-ring-outer', 0, CY, 0);
r3.rotation.x = 1.45; r3.rotation.z = 0.35;
// charging pad grounds the hover
mesh(new THREE.CylinderGeometry(0.16, 0.19, 0.02, 48), M.shell, 'pad', 0, 0.01, 0);
const padRing = mesh(new THREE.TorusGeometry(0.175, 0.006, 12, 96), M.ringCyan, 'pad-ring', 0, 0.024, 0);
padRing.rotation.x = Math.PI / 2;
stage.setObject(g);

// --- full 360° freedom in every axis, both directions ---
const c = stage._controls;
c.enablePan = true;
c.minPolarAngle = 0;          // straight down from the top
c.maxPolarAngle = Math.PI;    // all the way under the pad
c.minAzimuthAngle = -Infinity; // unlimited horizontal spin
c.maxAzimuthAngle = Infinity;
c.minDistance = 0.35;
c.maxDistance = 14;
c.autoRotate = false;
c.autoRotateSpeed = 1.6;
c.zoomSpeed = 1.15;
c.rotateSpeed = 1.05;

let spin = 0;      // -1 reverse, 0 off, 1 forward (yaw, via controls)
let tumble = 0;    // -1 reverse, 0 off, 1 forward (pitch+roll, via object)
const btn = (label, fn) => {
  const b = document.createElement('button');
  b.textContent = label; b.onclick = () => { fn(); paint(); };
  return b;
};
const bar = document.createElement('div');
bar.className = 'bar';
const bSpinR = btn('◀ SPIN', () => { spin = spin === -1 ? 0 : -1; });
const bSpinF = btn('SPIN ▶', () => { spin = spin === 1 ? 0 : 1; });
const bTumbleR = btn('◀ TUMBLE', () => { tumble = tumble === -1 ? 0 : -1; });
const bTumbleF = btn('TUMBLE ▶', () => { tumble = tumble === 1 ? 0 : 1; });
const bReset = btn('RESET VIEW', () => {
  spin = 0; tumble = 0; g.rotation.set(0, 0, 0);
  stage.setObject(g); // re-frames the camera on the object's bounds
});
bar.append(bSpinR, bSpinF, bTumbleR, bTumbleF, bReset);
document.body.appendChild(bar);
function paint() {
  c.autoRotate = spin !== 0;
  c.autoRotateSpeed = 1.6 * (spin || 1);
  bSpinR.classList.toggle('on', spin === -1);
  bSpinF.classList.toggle('on', spin === 1);
  bTumbleR.classList.toggle('on', tumble === -1);
  bTumbleF.classList.toggle('on', tumble === 1);
}
let last = performance.now();
(function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (tumble) { g.rotation.x += 0.55 * tumble * dt; g.rotation.z += 0.22 * tumble * dt; }
  requestAnimationFrame(loop);
})(last);
paint();
</script>
