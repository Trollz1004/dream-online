interface:
  display_name: Hallmark
  short_description: Design skill. Pages that look made, not generated.
  default_prompts:
    - "$hallmark a landing page for <product>"
    - "$hallmark a pricing page for <product>, custom"
    - "$hallmark a signup form component"
    - "$hallmark redesign <path to a page or an app>"

policy:
  allow_implicit_invocation: true

dependencies: []
house_rules: "docs/house/HOUSE-MOTION-RULE.md and docs/house/THE-HOUSE.md. Read before any design, site, dashboard or header job. Pointers only; do not restate rules here."
current_beats_existing: "Current beats existing: fetch and pull main first; origin main wins over clone, cache, journal and definition file; a clone that cannot fast-forward stops and reports (ops/handoffs/FABLE-HANDOFFS-2026-11-06.md section 0)."
