<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DREAM Engine — Island Test Scene (WebGPU)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0a0c; overflow: hidden; font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #hud { position: fixed; top: 12px; left: 12px; padding: 8px 14px; background: rgba(10, 10, 12, 0.76); border: 1px solid rgba(255, 255, 255, 0.18); color: #f5f5f7; font-size: 14px; font-weight: 300; letter-spacing: 0.04em; z-index: 10; }
      #help { position: fixed; bottom: 14px; left: 12px; padding: 10px 14px; background: rgba(10, 10, 12, 0.76); border: 1px solid rgba(255, 255, 255, 0.18); color: #e5e5ea; font-size: 14px; font-weight: 300; line-height: 1.5; z-index: 10; }
      #help b { color: #f5f5f7; font-weight: 400; }
      #fail { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0a0a0c; color: #f5f5f7; font-size: 20px; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">Loading island…</div>
    <div id="help">
      <b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump · <b>Drag</b> look · <b>Wheel</b> zoom<br />
      <b>F</b> Smith Service Table · <b>V</b> Fable's Anvil Summon · <b>N</b> Night Truck Midway · <b>M</b> Town Smith
    </div>
    <div id="smith-modal-root"></div>
    <div id="fail">This test scene needs WebGPU or WebGL2.<br />Please open it in a current browser.</div>
    <script type="module" src="/src/engine/island/main.ts"></script>
  </body>
</html>
