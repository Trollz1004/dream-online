<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DREAM Engine — Island Test Scene (WebGPU)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #9cc7e6; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #hud { position: fixed; top: 12px; left: 12px; padding: 8px 12px; border-radius: 10px; background: rgba(10, 20, 30, 0.55); color: #f4f7fa; font-size: 15px; letter-spacing: 0.2px; }
      #help { position: fixed; bottom: 14px; left: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(10, 20, 30, 0.55); color: #f4f7fa; font-size: 15px; line-height: 1.55; }
      #help b { color: #ffd9a0; font-weight: 600; }
      #fail { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #10202c; color: #f4f7fa; font-size: 20px; text-align: center; padding: 24px; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">Loading island…</div>
    <div id="help">
      <b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump · <b>Drag</b> look · <b>Wheel</b> zoom<br />
      <b>Q</b> next element · <b>E</b> cast · <b>1–4</b> quality Low→Ultra · <b>T</b> tone map · <b>H</b> hide help
    </div>
    <div id="fail">This test scene needs WebGPU.<br />Please open it in a current Chrome or Edge.</div>
    <script type="module" src="/src/engine/island/main.ts"></script>
  </body>
</html>
